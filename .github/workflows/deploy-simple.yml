name: Order-Reservation Mgmt CI/CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

env:
  NODE_VERSION: "20"
  DEPLOY_USER: "deployer"
  DEPLOY_PATH: "/var/www/mypal/frontend/order-reservation-mgmt"
  APP_PORT: "4101"
  PM2_APP_NAME: "order-reservation-mgmt"
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_PORT: ${{ secrets.SERVER_PORT }}

jobs:
  merge-test-deploy:
    name: Auto-merge to Main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[merge-to-main]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Merge, build & test
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout main
          git merge --no-ff dev -m "Auto-merge: dev → main [skip ci]"
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Push to main
        run: git push origin main

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Create environment file
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_ENV=production
          NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NODE_ENV=production
          PORT=${{ env.APP_PORT }}
          NEXT_TELEMETRY_DISABLED=1
          EOF
      - name: Build application
        run: NODE_OPTIONS="--max_old_space_size=4096" pnpm run build
      - name: Create Sentry release and upload sourcemaps
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mypal-hospitality-innovation-s
        with:
          environment: production
          version: ${{ github.sha }}
          projects: order-reservation-mgmt
          sourcemaps: .next/static/chunks
          ignore_missing: true
      - name: Create deployment package
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          mkdir -p deploy-temp
          cp -r .next/standalone/. deploy-temp/
          [ -f ecosystem.config.js ] && cp ecosystem.config.js deploy-temp/
          cp .env.production deploy-temp/
          cd deploy-temp && tar -czf ../deploy-package.tar.gz .
      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy-package.tar.gz"
          target: "/home/deployer/deploy-temp/"
      - name: Remote deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            NEW_DIR="${{ env.DEPLOY_PATH }}/deploy_$(date +%Y%m%d_%H%M%S)"
            mkdir -p ${NEW_DIR}
            tar -xzf "/home/deployer/deploy-temp/deploy-package.tar.gz" -C ${NEW_DIR}
            cd ${NEW_DIR} && cp .env.production .env.local
            pm2 delete "${{ env.PM2_APP_NAME }}-new" 2>/dev/null || true
            NODE_ENV=production PORT=${{ env.APP_PORT }} HOSTNAME=0.0.0.0 pm2 start server.js --name "${{ env.PM2_APP_NAME }}-new" -i 1 --max-memory-restart 512M
            sleep 10
            if curl -fs http://localhost:${{ env.APP_PORT }} >/dev/null 2>&1; then
              pm2 delete ${{ env.PM2_APP_NAME }} 2>/dev/null || true
              pm2 restart "${{ env.PM2_APP_NAME }}-new" --name ${{ env.PM2_APP_NAME }}
              ln -sf ${NEW_DIR} ${{ env.DEPLOY_PATH }}/current
              pm2 save --force
            else
              pm2 delete "${{ env.PM2_APP_NAME }}-new" && exit 1
            fi
